<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --grad: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #D946EF 100%);
      --ink: #0F172A; --muted: #64748B; --bg: #F4F6FB; --card: #FFFFFF; --line: #E8ECF4;
      --accent: #6366F1; --user-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
      --bot-bubble: #F8FAFF; --mark-bg: #FDE047;
    }
    body.dark {
      --ink: #E2E8F0; --muted: #94A3B8; --bg: #0B1220; --card: #111A2E; --line: #1E293B;
      --accent: #818CF8; --bot-bubble: #111A2E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; transition: background 0.25s, color 0.25s;
    }
    body[dir="ltr"] { font-family: 'Inter', 'Tajawal', system-ui, sans-serif; }
    .wrap { max-width: 840px; margin: 0 auto; padding: 0 20px 32px; }

    header {
      background: var(--grad); color: #fff; padding: 22px 24px 18px;
      border-radius: 0 0 26px 26px; box-shadow: 0 10px 30px rgba(99,102,241,0.3);
    }
    header .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-svg { flex: none; }
    .brand h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
    .brand p { font-size: 0.82rem; margin: 3px 0 0; opacity: 0.88; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      border: 0; background: rgba(255,255,255,0.16); color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 10px; font-size: 17px; display: grid; place-items: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.3); }
    .lang-switch { display: flex; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px; gap: 2px; }
    .lang-switch button {
      border: 0; background: transparent; color: #fff; cursor: pointer; padding: 7px 14px;
      border-radius: 999px; font-weight: 700; font-size: 0.85rem; font-family: inherit; transition: all 0.15s;
    }
    .lang-switch button.active { background: #fff; color: #6D28D9; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28); padding: 5px 12px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 700; backdrop-filter: blur(4px);
    }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; background: var(--card);
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
      font-size: 0.84rem; color: var(--muted); box-shadow: 0 1px 3px rgba(15,23,42,0.05);
    }
    .pill .ic { font-size: 0.95rem; }
    .pill b { color: var(--ink); font-weight: 700; }

    #log {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px; min-height: 300px; max-height: 54vh; overflow-y: auto;
      box-shadow: 0 6px 20px rgba(15,23,42,0.05);
    }
    .msg { margin: 12px 0; display: flex; flex-direction: column; animation: fadeUp 0.28s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg.user { align-items: flex-end; }
    .msg.bot { align-items: flex-start; }
    body[dir="ltr"] .msg.user { align-items: flex-start; }
    body[dir="ltr"] .msg.bot { align-items: flex-end; }
    .bubble { max-width: 85%; padding: 11px 15px; border-radius: 14px; line-height: 1.8; white-space: pre-wrap; font-size: 0.95rem; }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .src { font-size: 0.76rem; color: var(--muted); margin-top: 5px; padding: 0 4px; }
    mark { background: var(--mark-bg); color: #111; padding: 0 3px; border-radius: 4px; }

    form { display: flex; gap: 10px; margin-top: 14px; }
    input {
      flex: 1; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px;
      font-size: 15px; font-family: inherit; background: var(--card); color: var(--ink);
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,0.14); }
    button.primary {
      border: 0; background: var(--grad); color: #fff; padding: 14px 22px; border-radius: 14px;
      font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 6px 16px rgba(139,92,246,0.3); transition: transform 0.1s, box-shadow 0.1s;
    }
    button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button.ghost {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      padding: 9px 16px; border-radius: 12px; font-family: inherit; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 12px; text-align: center; }

    .history-panel {
      margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
      padding: 14px; max-height: 240px; overflow-y: auto;
    }
    .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .history-head b { font-size: 0.95rem; }
    .h-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.84rem; }
    .h-item:last-child { border-bottom: 0; }
    .h-item .q { font-weight: 700; }
    .h-item .meta { color: var(--muted); font-size: 0.76rem; direction: ltr; text-align: left; }

    .docs-panel {
      margin: 14px 0 0; border: 1px solid var(--line); border-radius: 16px; background: var(--card);
      padding: 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.04);
    }
    .docs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .docs-head b { font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; }
    .drop-zone {
      border: 2px dashed var(--line); border-radius: 14px; padding: 18px 14px; text-align: center;
      color: var(--muted); font-size: 0.86rem; cursor: pointer; transition: all 0.15s; background: var(--bot-bubble);
    }
    .drop-zone:hover, .drop-zone.drag {
      border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.06);
    }
    .drop-zone .dz-ic { font-size: 1.7rem; display: block; margin-bottom: 4px; }
    .drop-zone input { display: none; }
    .doc-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .doc-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 11px; font-size: 0.85rem;
    }
    .doc-item .name { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
    .doc-item .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item .size { color: var(--muted); font-size: 0.75rem; direction: ltr; }
    .doc-item button {
      border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 0.9rem;
      border-radius: 8px; padding: 4px 8px; transition: all 0.15s; flex: none;
    }
    .doc-item button:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <svg class="logo-svg" width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="44" height="44" rx="13" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)"/>
            <path d="M14 10h10l7 7v16a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2Z" fill="#fff"/>
            <path d="M24 10v7h7" fill="none" stroke="#8B5CF6" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="33" cy="11" r="3" fill="#FDE047"/>
          </svg>
          <div>
            <h1 data-i18n="title">اسأل مستنداتك</h1>
            <p data-i18n="tagline">محرك إجابات ذكي يعتمد على مستنداتك</p>
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="theme-toggle" type="button" title="الوضع">🌙</button>
          <button class="icon-btn" id="history-toggle" type="button" title="سجل">🕘</button>
          <div class="lang-switch">
            <button id="lang-ar" class="active" type="button">عربي</button>
            <button id="lang-en" type="button">EN</button>
          </div>
        </div>
      </div>
      <div class="badges">
        <span class="badge">⚡ RAG</span>
        <span class="badge" data-i18n="b_local">🔒 محلي بالكامل</span>
        <span class="badge">📄 PDF</span>
        <span class="badge" data-i18n="b_openai">🤖 يدعم OpenAI</span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="stats">
      <span class="pill"><span class="ic">📄</span> <b data-i18n="docs">المستندات</b>: <b id="stat-docs">0</b></span>
      <span class="pill"><span class="ic">🧩</span> <b data-i18n="chunks">المقاطع</b>: <b id="stat-chunks">0</b></span>
    </div>

    <div class="docs-panel">
      <div class="docs-head">
        <b>📂 <span data-i18n="myDocs">مستنداتي</span></b>
        <button class="ghost" id="add-doc-btn" type="button"><span>＋</span> <span data-i18n="upload">رفع مستندات</span></button>
      </div>
      <div class="drop-zone" id="drop-zone">
        <span class="dz-ic">⬆️</span>
        <span data-i18n="drop">اسحب الملفات هنا أو اضغط للاختيار</span>
        <div style="font-size:0.74rem;opacity:0.75" data-i18n="dropHint">المدعوم: txt · md · pdf</div>
        <input type="file" id="file-input" accept=".txt,.md,.pdf" multiple />
      </div>
      <div class="doc-list" id="doc-list"></div>
    </div>

    <div id="log"></div>

    <form id="form">
      <input id="q" data-i18n-ph="placeholder" placeholder="اطرح سؤالًا هنا..." autocomplete="off" />
      <button class="primary" type="submit"><span>➤</span> <span data-i18n="send">إرسال</span></button>
    </form>
    <div class="tools">
      <button class="ghost" id="reindex" type="button"><span>🔄</span> <span data-i18n="reindex">فهرسة المستندات</span></button>
      <button class="ghost" id="clear-chat" type="button"><span>🗑️</span> <span data-i18n="clear">مسح المحادثة</span></button>
    </div>

    <div class="history-panel" id="history-panel" hidden>
      <div class="history-head">
        <b data-i18n="history">سجل البحث</b>
        <button class="ghost" id="clear-history" type="button"><span data-i18n="clearHistory">مسح السجل</span></button>
      </div>
      <div id="history-list"></div>
    </div>

    <p class="hint" data-i18n="hint">💡 جرّب: «ما هي ثلاثية CIA؟» أو «ما هو RAG؟»</p>
  </div>

  <script>
    const STR = {
      ar: {
        title: 'اسأل مستنداتك', tagline: 'محرك إجابات ذكي يعتمد على مستنداتك',
        docs: 'المستندات', chunks: 'المقاطع', placeholder: 'اطرح سؤالًا هنا...', send: 'إرسال',
        reindex: 'فهرسة المستندات', clear: 'مسح المحادثة',
        hint: '💡 جرّب: «ما هي ثلاثية CIA؟» أو «ما هو RAG؟»',
        sources: 'المصادر', indexing: 'جارٍ الفهرسة…', error: 'خطأ',
        matches: 'مطابقة', lines: 'الأسطر',
        b_local: '🔒 محلي بالكامل', b_openai: '🤖 يدعم OpenAI',
        history: 'سجل البحث', clearHistory: 'مسح السجل', noHistory: 'لا يوجد سجل بعد', device: 'الجهاز',
        myDocs: 'مستنداتي', upload: 'رفع مستندات', drop: 'اسحب الملفات هنا أو اضغط للاختيار',
        dropHint: 'المدعوم: txt · md · pdf', uploading: 'جارٍ الرفع والفهرسة…',
        delete: 'حذف', noDocs: 'لا توجد مستندات بعد', confirmDel: 'حذف هذا المستند نهائيًا؟',
        uploadDone: 'تم رفع وفهرسة', uploadError: 'فشل الرفع'
      },
      en: {
        title: 'Ask Your Documents', tagline: 'A smart document-based answers engine',
        docs: 'Documents', chunks: 'Chunks', placeholder: 'Ask a question...', send: 'Send',
        reindex: 'Re-index documents', clear: 'Clear chat',
        hint: '💡 Try: "What is the CIA triad?" or "What is RAG?"',
        sources: 'Sources', indexing: 'Indexing…', error: 'Error',
        matches: 'matches', lines: 'lines',
        b_local: '🔒 Local-first', b_openai: '🤖 OpenAI ready',
        history: 'Search history', clearHistory: 'Clear history', noHistory: 'No history yet', device: 'Device',
        myDocs: 'My documents', upload: 'Upload documents', drop: 'Drag files here or click to browse',
        dropHint: 'Supported: txt · md · pdf', uploading: 'Uploading & indexing…',
        delete: 'Delete', noDocs: 'No documents yet', confirmDel: 'Delete this document permanently?',
        uploadDone: 'Uploaded & indexed', uploadError: 'Upload failed'
      }
    };

    let lang = 'ar';
    const log = document.getElementById('log');
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function applyLang(l) {
      lang = l;
      document.documentElement.lang = l;
      document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = STR[l][el.dataset.i18n] || el.textContent; });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = STR[l][el.dataset.i18nPh] || el.placeholder; });
      document.getElementById('lang-ar').classList.toggle('active', l === 'ar');
      document.getElementById('lang-en').classList.toggle('active', l === 'en');
    }

    function applyTheme(t) {
      document.body.classList.toggle('dark', t === 'dark');
      localStorage.setItem('theme', t);
      document.getElementById('theme-toggle').textContent = (t === 'dark') ? '☀️' : '🌙';
    }

    function parseUA(ua) {
      let browser = '';
      if (/Edg\//.test(ua)) browser = 'Edge';
      else if (/Firefox\//.test(ua)) browser = 'Firefox';
      else if (/Chrome\//.test(ua)) browser = 'Chrome';
      else if (/Safari\//.test(ua)) browser = 'Safari';
      else browser = 'Browser';
      let os = '';
      if (/Windows/.test(ua)) os = 'Windows';
      else if (/Mac OS X/.test(ua)) os = 'macOS';
      else if (/Android/.test(ua)) os = 'Android';
      else if (/iPhone|iPad/.test(ua)) os = 'iOS';
      else if (/Linux/.test(ua)) os = 'Linux';
      else os = 'Unknown OS';
      return os + ' · ' + browser;
    }

    document.getElementById('lang-ar').addEventListener('click', () => applyLang('ar'));
    document.getElementById('lang-en').addEventListener('click', () => applyLang('en'));
    document.getElementById('theme-toggle').addEventListener('click', () => applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark'));

    function add(kind, html) {
      const d = document.createElement('div');
      d.className = 'msg ' + kind;
      d.innerHTML = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function refreshStats() {
      try {
        const r = await fetch('/api/stats');
        const data = await r.json();
        document.getElementById('stat-docs').textContent = data.documents;
        document.getElementById('stat-chunks').textContent = data.chunks;
      } catch (e) { /* ignore */ }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function loadDocuments() {
      const list = document.getElementById('doc-list');
      list.innerHTML = '';
      try {
        const r = await fetch('/api/documents');
        const data = await r.json();
        const docs = data.documents || [];
        if (!docs.length) {
          list.innerHTML = '<div class="doc-item" style="justify-content:center;color:var(--muted)">' + STR[lang].noDocs + '</div>';
          return;
        }
        docs.forEach(d => {
          const item = document.createElement('div');
          item.className = 'doc-item';
          const nameDiv = document.createElement('div');
          nameDiv.className = 'name';
          nameDiv.innerHTML = '📄 <span></span>';
          nameDiv.querySelector('span').textContent = d.name;
          nameDiv.querySelector('span').title = d.name;
          const right = document.createElement('div');
          right.style.cssText = 'display:flex;align-items:center;gap:6px';
          const size = document.createElement('span');
          size.className = 'size';
          size.textContent = formatSize(d.size);
          const del = document.createElement('button');
          del.type = 'button';
          del.title = STR[lang].delete;
          del.textContent = '🗑️';
          del.dataset.del = d.name;
          right.appendChild(size);
          right.appendChild(del);
          item.appendChild(nameDiv);
          item.appendChild(right);
          list.appendChild(item);
        });
      } catch (e) {
        list.innerHTML = '<div class="doc-item" style="justify-content:center;color:var(--muted)">' + STR[lang].error + '</div>';
      }
    }

    async function uploadFiles(files) {
      if (!files || !files.length) return;
      add('bot', '<div class="src">' + STR[lang].uploading + '</div>');
      for (const file of files) {
        try {
          const fd = new FormData();
          fd.append('file', file);
          const r = await fetch('/api/upload', { method: 'POST', body: fd });
          const data = await r.json();
          if (data.error) {
            add('bot', '<div class="src">⚠️ ' + STR[lang].uploadError + ': ' + esc(data.error) + '</div>');
          } else {
            add('bot', '<div class="src">✅ ' + STR[lang].uploadDone + ': ' + esc(data.file) + ' (' + data.chunks + ' ' + STR[lang].chunks + ')</div>');
          }
        } catch (err) {
          add('bot', '<div class="src">⚠️ ' + STR[lang].uploadError + ': ' + esc(err) + '</div>');
        }
      }
      refreshStats();
      loadDocuments();
    }

    async function loadHistory() {
      const panel = document.getElementById('history-panel');
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      try {
        const r = await fetch('/api/history');
        const data = await r.json();
        if (!data.history || !data.history.length) {
          list.innerHTML = '<div class="h-item">' + STR[lang].noHistory + '</div>';
          return;
        }
        data.history.forEach(h => {
          const d = document.createElement('div');
          d.className = 'h-item';
          d.innerHTML = '<div class="q" dir="auto">' + esc(h.query) + '</div>' +
            '<div class="meta">🕘 ' + esc(h.time) + ' · IP ' + esc(h.ip) + ' · ' + STR[lang].device + ': ' + esc(parseUA(h.ua)) + '</div>';
          list.appendChild(d);
        });
      } catch (e) { list.innerHTML = '<div class="h-item">' + STR[lang].error + '</div>'; }
    }

    document.getElementById('history-toggle').addEventListener('click', () => {
      const panel = document.getElementById('history-panel');
      panel.hidden = !panel.hidden;
      if (!panel.hidden) loadHistory();
    });
    document.getElementById('clear-history').addEventListener('click', async () => {
      await fetch('/api/clear-history', { method: 'POST' });
      loadHistory();
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('q');
      const q = input.value.trim();
      if (!q) return;
      add('user', '<div class="bubble" dir="auto">' + esc(q) + '</div>');
      input.value = '';
      try {
        const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question: q }) });
        const data = await r.json();
        add('bot', '<div class="bubble" dir="auto">🤖 ' + (data.answer || '') + '</div>');
        if (data.sources && data.sources.length) add('bot', '<div class="src" dir="ltr">' + STR[lang].sources + ': ' + esc(data.sources.join(', ')) + '</div>');
        if (data.matches && data.matches.length) {
          data.matches.forEach(m => {
            const lines = (m.lines && m.lines.length) ? m.lines.join('، ') : '-';
            add('bot', '<div class="src" dir="ltr">📌 ' + esc(m.source) + ' — ' + m.count + ' ' + STR[lang].matches + ' · ' + STR[lang].lines + ': ' + esc(lines) + '</div>');
          });
        }
      } catch (err) { add('bot', '<div class="bubble" dir="auto">⚠️ ' + STR[lang].error + ': ' + esc(err) + '</div>'); }
    });

    document.getElementById('reindex').addEventListener('click', async () => {
      add('bot', '<div class="src">' + STR[lang].indexing + '</div>');
      try {
        const r = await fetch('/api/ingest', { method: 'POST' });
        const data = await r.json();
        add('bot', '<div class="src" dir="ltr">' + esc(JSON.stringify(data)) + '</div>');
        refreshStats();
      } catch (err) { add('bot', '<div class="src">' + STR[lang].error + ': ' + esc(err) + '</div>'); }
    });

    document.getElementById('clear-chat').addEventListener('click', () => { log.innerHTML = ''; });

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    document.getElementById('add-doc-btn').addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { uploadFiles(fileInput.files); fileInput.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag'); }));
    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) uploadFiles(files);
    });

    document.getElementById('doc-list').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-del]');
      if (!btn) return;
      const name = btn.dataset.del;
      if (!confirm(STR[lang].confirmDel + '\n' + name)) return;
      try {
        const r = await fetch('/api/delete-document', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
        const data = await r.json();
        if (data.error) add('bot', '<div class="src">⚠️ ' + STR[lang].error + ': ' + esc(data.error) + '</div>');
      } catch (err) {
        add('bot', '<div class="src">⚠️ ' + STR[lang].error + ': ' + esc(err) + '</div>');
      }
      refreshStats();
      loadDocuments();
    });

    applyLang('ar');
    applyTheme(localStorage.getItem('theme') || 'light');
    refreshStats();
    loadDocuments();
  </script>
</body>
</html>
