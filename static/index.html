<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --grad: linear-gradient(135deg, #6366F1 0%, #8B5CF6 55%, #D946EF 100%);
      --ink: #0F172A;
      --muted: #64748B;
      --bg: #F4F6FB;
      --card: #FFFFFF;
      --line: #E8ECF4;
      --accent: #6366F1;
      --user-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
      --mark-bg: #FDE047;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    body[dir="ltr"] { font-family: 'Inter', 'Tajawal', system-ui, sans-serif; }

    .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 32px; }

    header {
      background: var(--grad);
      color: #fff;
      margin: 0 0 20px;
      padding: 22px 24px;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.28);
    }
    header .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 22px;
      backdrop-filter: blur(4px);
    }
    .brand h1 { font-size: 1.35rem; font-weight: 800; margin: 0; }
    .brand p { font-size: 0.82rem; margin: 2px 0 0; opacity: 0.85; }

    .lang-switch {
      display: flex; background: rgba(255,255,255,0.16);
      border-radius: 999px; padding: 3px; gap: 2px;
    }
    .lang-switch button {
      border: 0; background: transparent; color: #fff; cursor: pointer;
      padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
      font-family: inherit; transition: all 0.15s;
    }
    .lang-switch button.active { background: #fff; color: #6D28D9; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

    .stats {
      display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px;
    }
    .pill {
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 14px; font-size: 0.82rem; color: var(--muted); box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .pill b { color: var(--ink); font-weight: 700; }

    #log {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px; min-height: 320px; max-height: 56vh; overflow-y: auto;
      box-shadow: 0 6px 20px rgba(15,23,42,0.05);
    }
    .msg { margin: 12px 0; display: flex; flex-direction: column; }
    .msg.user { align-items: flex-end; }
    .msg.bot { align-items: flex-start; }
    body[dir="ltr"] .msg.user { align-items: flex-start; }
    body[dir="ltr"] .msg.bot { align-items: flex-end; }
    .bubble {
      max-width: 85%; padding: 11px 15px; border-radius: 14px; line-height: 1.8;
      white-space: pre-wrap; font-size: 0.95rem;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: #F8FAFF; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .src { font-size: 0.76rem; color: #94A3B8; margin-top: 5px; padding: 0 4px; }
    mark { background: var(--mark-bg); color: #111; padding: 0 3px; border-radius: 4px; }

    form { display: flex; gap: 10px; margin-top: 14px; }
    input {
      flex: 1; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px;
      font-size: 15px; font-family: inherit; background: var(--card); color: var(--ink);
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,0.14); }
    button.primary {
      border: 0; background: var(--grad); color: #fff; padding: 14px 22px; border-radius: 14px;
      font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(139,92,246,0.3); transition: transform 0.1s, box-shadow 0.1s;
    }
    button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button.ghost {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      padding: 9px 16px; border-radius: 12px; font-family: inherit; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .hint { color: #94A3B8; font-size: 0.82rem; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <div class="logo">📄</div>
          <div>
            <h1 data-i18n="title">اسأل مستنداتك</h1>
            <p data-i18n="tagline">محرك إجابات ذكي يعتمد على مستنداتك</p>
          </div>
        </div>
        <div class="lang-switch">
          <button id="lang-ar" class="active" type="button">عربي</button>
          <button id="lang-en" type="button">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="stats">
      <span class="pill"><b data-i18n="docs">المستندات</b>: <b id="stat-docs">0</b></span>
      <span class="pill"><b data-i18n="chunks">المقاطع</b>: <b id="stat-chunks">0</b></span>
    </div>

    <div id="log"></div>

    <form id="form">
      <input id="q" data-i18n-ph="placeholder" placeholder="اطرح سؤالًا هنا..." autocomplete="off" />
      <button class="primary" type="submit" data-i18n="send">إرسال</button>
    </form>
    <div class="tools">
      <button class="ghost" id="reindex" type="button" data-i18n="reindex">فهرسة المستندات</button>
      <button class="ghost" id="clear-chat" type="button" data-i18n="clear">مسح المحادثة</button>
    </div>
    <p class="hint" data-i18n="hint">💡 جرّب: «ما هي ثلاثية CIA؟» أو «ما هو RAG؟»</p>
  </div>

  <script>
    const STR = {
      ar: {
        title: 'اسأل مستنداتك',
        tagline: 'محرك إجابات ذكي يعتمد على مستنداتك',
        docs: 'المستندات',
        chunks: 'المقاطع',
        placeholder: 'اطرح سؤالًا هنا...',
        send: 'إرسال',
        reindex: 'فهرسة المستندات',
        clear: 'مسح المحادثة',
        hint: '💡 جرّب: «ما هي ثلاثية CIA؟» أو «ما هو RAG؟»',
        sources: 'المصادر',
        indexing: 'جارٍ الفهرسة…',
        error: 'خطأ',
        you: 'أنت'
      },
      en: {
        title: 'Ask Your Documents',
        tagline: 'A smart document-based answers engine',
        docs: 'Documents',
        chunks: 'Chunks',
        placeholder: 'Ask a question...',
        send: 'Send',
        reindex: 'Re-index documents',
        clear: 'Clear chat',
        hint: '💡 Try: "What is the CIA triad?" or "What is RAG?"',
        sources: 'Sources',
        indexing: 'Indexing…',
        error: 'Error',
        you: 'You'
      }
    };

    let lang = 'ar';
    const log = document.getElementById('log');
    const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    function applyLang(l) {
      lang = l;
      document.documentElement.lang = l;
      document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = STR[l][el.dataset.i18n] || el.textContent;
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        el.placeholder = STR[l][el.dataset.i18nPh] || el.placeholder;
      });
      document.getElementById('lang-ar').classList.toggle('active', l === 'ar');
      document.getElementById('lang-en').classList.toggle('active', l === 'en');
    }

    document.getElementById('lang-ar').addEventListener('click', () => applyLang('ar'));
    document.getElementById('lang-en').addEventListener('click', () => applyLang('en'));

    function add(kind, html) {
      const d = document.createElement('div');
      d.className = 'msg ' + kind;
      d.innerHTML = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function refreshStats() {
      try {
        const r = await fetch('/api/stats');
        const data = await r.json();
        document.getElementById('stat-docs').textContent = data.documents;
        document.getElementById('stat-chunks').textContent = data.chunks;
      } catch (e) { /* ignore */ }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('q');
      const q = input.value.trim();
      if (!q) return;
      add('user', '<div class="bubble" dir="auto">' + esc(q) + '</div>');
      input.value = '';
      try {
        const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question: q }) });
        const data = await r.json();
        add('bot', '<div class="bubble" dir="auto">🤖 ' + (data.answer || '') + '</div>');
        if (data.sources && data.sources.length) {
          add('bot', '<div class="src" dir="ltr">' + STR[lang].sources + ': ' + esc(data.sources.join(', ')) + '</div>');
        }
      } catch (err) { add('bot', '<div class="bubble" dir="auto">⚠️ ' + STR[lang].error + ': ' + esc(err) + '</div>'); }
    });

    document.getElementById('reindex').addEventListener('click', async () => {
      add('bot', '<div class="src">' + STR[lang].indexing + '</div>');
      try {
        const r = await fetch('/api/ingest', { method: 'POST' });
        const data = await r.json();
        add('bot', '<div class="src" dir="ltr">' + esc(JSON.stringify(data)) + '</div>');
        refreshStats();
      } catch (err) { add('bot', '<div class="src">' + STR[lang].error + ': ' + esc(err) + '</div>'); }
    });

    document.getElementById('clear-chat').addEventListener('click', () => { log.innerHTML = ''; });

    applyLang('ar');
    refreshStats();
  </script>
</body>
</html>
